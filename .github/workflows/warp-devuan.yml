name: Warp Devuan

on:
  push:
    paths:
      - "packages/warp/**"
      - ".github/workflows/warp-devuan.yml"
      - "README.md"
      - "README.ru.md"
  pull_request:
    paths:
      - "packages/warp/**"
      - ".github/workflows/warp-devuan.yml"
      - "README.md"
      - "README.ru.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -f packages/warp/docker/Dockerfile.devuan -t warp:devuan packages/warp
      - name: Smoke test version
        run: docker run --rm warp:devuan --version
      - name: Smoke test help
        run: docker run --rm warp:devuan --help >/dev/null
