name: K1OS Container

on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - "rootfs/**"
      - "scripts/build-rootfs.sh"
      - "packages/**"
      - ".github/workflows/k1os-image.yml"
      - "README.md"
      - "README.ru.md"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - "rootfs/**"
      - "scripts/build-rootfs.sh"
      - "packages/**"
      - ".github/workflows/k1os-image.yml"
      - "README.md"
      - "README.ru.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        run: make image

      - name: Smoke test image
        run: docker run --rm k1os:local /bin/sh -lc 'grep -q "^NAME=\"K1OS\"" /etc/os-release && /usr/bin/fish --version >/dev/null && warp --version >/dev/null && warp --help >/dev/null'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/k1os"
          sha_tag="${GITHUB_SHA::7}"

          docker tag k1os:local "${image}:latest"
          docker tag k1os:local "${image}:${sha_tag}"
          docker push "${image}:latest"
          docker push "${image}:${sha_tag}"
